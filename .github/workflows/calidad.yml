name: Calidad y seguridad

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, seguridad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff - análisis estático
        run: python -m ruff check .

      - name: Ruff - formato (informativo, aún no bloqueante)
        run: python -m ruff format --check .
        continue-on-error: true

      - name: Bandit - código de la aplicación
        run: python -m bandit -c bandit.yaml -r app

      - name: Bandit - código de pruebas (B101 permitido en pruebas)
        run: python -m bandit -c bandit.yaml -r tests -s B101

      - name: pip-audit - vulnerabilidades en dependencias
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off

      - name: Pytest - regresiones
        run: python -m pytest -q
